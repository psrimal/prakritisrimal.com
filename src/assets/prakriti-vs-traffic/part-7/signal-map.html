<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal delay explorer: Jayanagar to Whitefield</title>
<meta name="description" content="Pick a direction and a time of day. See how long the drive from Jayanagar to Whitefield took, how much longer the traffic lights add, and click any stretch to see what slowed it down.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">

<style>
:root{
  --void:#060A0B;--instrument:#0B1112;--raised:#101819;--rule:#263535;--rule-strong:#456063;
  --text:#EEF1EA;--text-2:#A5B4B1;--text-3:#81918E;--brand:#A6F8C4;--brand-soft:#3f8f63;--auto:#F9AC75;--hot:#E34948;
  --mono:'Roboto Mono',ui-monospace,Consolas,monospace;--display:'Poppins',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--void);color:var(--text);font-family:var(--mono)}
b,strong{font-weight:500;color:#fff}

/* the full-screen tool */
#app{position:relative;height:100vh;min-height:640px;overflow:hidden}
#map{position:absolute;inset:0}
.maplibregl-ctrl-attrib{font-family:var(--mono);font-size:9px!important;background:rgba(6,10,11,.6)!important}
.maplibregl-ctrl-attrib a{color:var(--text-3)!important}
.maplibregl-ctrl-group{background:var(--instrument)!important;border:1px solid var(--rule);box-shadow:none!important;border-radius:0!important}
.maplibregl-ctrl-group button{background:transparent!important}
.maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:invert(1) brightness(.8)}

/* top-left: three boxes in a row, the analysis underneath */
#tl{position:absolute;left:18px;top:18px;z-index:5;display:flex;flex-direction:column;gap:10px;width:min(556px,calc(100% - 36px));max-height:calc(100% - 200px);pointer-events:none}
#tl>*{pointer-events:auto}
#card{display:flex;gap:8px}
.stat{flex:1 1 0;min-width:0;background:rgba(11,17,18,.94);border:1px solid var(--rule);border-left:3px solid var(--rule-strong);padding:12px 14px 12px}
.stat .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-2);line-height:1.35}
.stat .v{font-family:var(--display);font-weight:700;font-size:42px;line-height:1.05;margin:6px 0 4px;color:var(--text);white-space:nowrap}
.stat .v small{font-family:var(--mono);font-weight:400;font-size:13px;color:var(--text-3);margin-left:6px}
.stat .s{font-size:11px;color:var(--text-3);line-height:1.45}
.stat.b{border-left-color:var(--auto)}.stat.b .v{color:var(--auto)}
.stat.c{border-left-color:var(--brand)}.stat.c .v{color:var(--brand)}

/* top-right: the time */
#clock{position:absolute;right:22px;top:14px;z-index:5;text-align:right;pointer-events:none}
#clock .t{font-family:var(--display);font-weight:700;font-size:48px;line-height:1;letter-spacing:-.01em}
#clock .d{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-3);margin-top:4px}

/* the analysis, under the three boxes */
#side{position:static;width:min(380px,100%);overflow:auto;background:rgba(11,17,18,.95);border:1px solid var(--rule);padding:16px 18px 14px}
#side.compact{width:min(270px,100%);padding:12px 15px}
#side h3{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.3;margin:0 0 3px;color:var(--text)}
#side .sub{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin:0 0 14px;line-height:1.6}
#side p{font-size:13px;line-height:1.65;color:var(--text-2);margin:0 0 12px}
#side .hint{font-size:13.5px;line-height:1.55;color:var(--text);margin:0}
#side .small{font-size:12px;color:var(--text-3);margin:6px 0 0}
#side .hint2{font-size:12px;color:var(--text-3);margin:10px 0 0}
#side h4{font-size:9.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--brand);margin:18px 0 8px}
#side .lost{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1;color:var(--text);margin:2px 0 6px}
#side .lost small{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--text-3);margin-left:4px;letter-spacing:.05em}
.back{appearance:none;background:none;border:0;color:var(--brand);font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:0 0 12px;cursor:pointer}
.verdict{border-left:2px solid var(--brand);padding:2px 0 2px 12px;margin:4px 0 14px;font-size:13px;line-height:1.6;color:var(--text)}
.bars .r{display:grid;grid-template-columns:128px 1fr 62px;gap:8px;align-items:center;margin:7px 0;font-size:11px;color:var(--text-2)}
.bars .r .b{height:8px;background:var(--rule);position:relative}
.bars .r .b i{position:absolute;left:0;top:0;height:100%}
.bars .r .v{text-align:right;color:var(--text)}
.sig{margin:0;padding:0;list-style:none}
.sig li{padding:9px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:12px;color:var(--text-2);line-height:1.5}
.sig li:hover{color:var(--text)}
.sig li b{display:block}
.mini svg{display:block;width:100%;height:auto}
svg text{font-family:var(--mono);font-size:9.5px;fill:var(--text-3)}

/* bottom: all controls */
.ctrl{position:absolute;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(to top,rgba(6,10,11,.97),rgba(6,10,11,.78) 70%,transparent);padding:16px 22px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end}
.ctl{display:flex;flex-direction:column;gap:6px}
.ctl>label{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-3);line-height:1;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--rule);background:var(--instrument);height:40px}
.seg button{background:none;border:0;color:var(--text-2);font-family:var(--mono);font-size:11px;letter-spacing:.14em;height:38px;padding:0 14px;cursor:pointer;text-transform:uppercase}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--brand);color:var(--void);font-weight:500}
.seg.times button{padding:0 11px;letter-spacing:.06em}
.play{background:var(--brand);color:var(--void);border:0;font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.14em;height:40px;padding:0 24px;cursor:pointer;text-transform:uppercase}
.play:hover{background:#c5fcd9}
button:focus-visible{outline:1px solid var(--brand);outline-offset:2px}

/* legend bottom-left, above the controls */
#legend{position:absolute;left:18px;bottom:98px;z-index:5;background:rgba(11,17,18,.9);border:1px solid var(--rule);padding:8px 12px;font-size:9.5px;color:var(--text-3);width:210px}
#legend .cap{margin:0 0 3px;letter-spacing:.06em}
#legend .rp{height:6px;margin:0 0 2px;background:linear-gradient(90deg,#3E8F5C,#F2C879 55%,#E34948)}
#legend .tk{display:flex;justify-content:space-between;margin-bottom:8px}
#legend .tk:last-child{margin-bottom:0}

/* chips on the map */
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--text);background:#000;padding:3px 7px;border-left:2px solid var(--brand);cursor:pointer;white-space:nowrap;transform:translate(-50%,-50%)}
.chip:hover{background:#1a2324}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text);text-shadow:0 0 5px #000,0 0 5px #000;white-space:nowrap;pointer-events:none}
.lbl.sm{font-size:9.5px;color:var(--text-2)}
#tip{position:fixed;z-index:30;pointer-events:none;display:none;background:#0B1112f2;border:1px solid var(--rule-strong);padding:9px 11px;font-size:11.5px;line-height:1.55;color:var(--text-2);max-width:290px}
#tip b{color:var(--text)}

@media (max-width:900px){
  #tl{left:10px;top:10px;width:calc(100% - 20px)}
  .stat{padding:8px 10px}.stat .v{font-size:26px}.stat .k{font-size:8.5px}.stat .s{display:none}
  #clock .t{font-size:30px}#clock{right:12px;top:auto;bottom:112px}
  #side,#side.compact{width:100%}
  #legend{display:none}
  .ctrl{padding:10px 12px;gap:8px 14px}
  .seg button{padding:0 9px;font-size:10px}
}

/* below the map: plain-language notes */
.notes{background:var(--void);padding:56px 0 90px;border-top:1px solid var(--rule)}
.notes .wrap{width:min(760px,88%);margin:0 auto}
.notes h2{font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,3vw,2rem);line-height:1.2;margin:0 0 18px}
.notes h3{font-family:var(--display);font-weight:600;font-size:1.05rem;margin:34px 0 10px;color:var(--brand)}
.notes p,.notes li{font-size:.95rem;line-height:1.8;color:var(--text-2)}
.notes ul{padding-left:1.1rem}
.notes li{margin:.4rem 0}
.notes strong{color:#fff}
.notes .src{margin-top:40px;font-size:.75rem;color:var(--text-3);line-height:1.8}
@media (max-width:640px){
  #app{min-height:0}
  #clock{display:none}
  .ctrl{gap:8px 10px}
  .ctl{min-width:0;max-width:100%}
  .seg.times{max-width:calc(100vw - 24px);overflow-x:auto;-webkit-overflow-scrolling:touch}
  .seg.times button{flex:none}
  .chip{font-size:9.5px;padding:2px 5px}
}
</style>
</head>
<body>
<div id="tip"></div>

<div id="app">
  <div id="map" aria-label="Map of the Jayanagar to Whitefield drive"></div>

  <div id="tl"><div id="card"></div><div id="side" aria-live="polite"></div></div>
  <div id="clock"><div class="t" id="clockT">08:00</div></div>
  <div id="legend"></div>

  <div class="ctrl">
    <div class="ctl"><label>Commute</label><div class="seg" id="dirTog"><button data-d="morning" class="on">Morning</button><button data-d="evening">Evening</button></div></div>
    <div class="ctl"><label>Red-light wait</label><div class="seg" id="metTog"><button data-k="mean" class="on">Average</button><button data-k="max">Longest</button></div></div>
    <div class="ctl"><label>On the road at</label><div class="seg times" id="tbtns"></div></div>
    <div class="ctl"><label>&nbsp;</label><button class="play" id="play">Play</button></div>
  </div>
</div>

/* ---------- time on the road: only the windows covered by the observations ---------- */
const WIN={morning:[7*60,10*60+30],evening:[17*60,20*60+30]};     // last departure: 10:30 in the morning, 20:30 in the evening
const STOPS_BY={};for(const d in WIN){STOPS_BY[d]=[];for(let m=WIN[d][0];m<=WIN[d][1];m+=30)STOPS_BY[d].push(m)}
const st={dir:'morning',met:'mean',i:2,sel:null,seg:null,timer:null};
const stops=()=>STOPS_BY[st.dir];
const curM=()=>stops()[Math.min(st.i,stops().length-1)];
(function readHash(){const h=new URLSearchParams(location.hash.slice(1));
 if(h.get('d')==='evening')st.dir='evening'; if(h.get('m')==='max')st.met='max';
 if(h.get('t')){const k=stops().indexOf(hm(h.get('t')));if(k>=0)st.i=k}
 if(h.get('j')&&S.some(s=>s.junction_id===h.get('j')))st.sel=h.get('j');
 else if(h.get('p')&&+h.get('p')>=1&&+h.get('p')<=9)st.seg=+h.get('p')})();
function writeHash(){const h=new URLSearchParams();h.set('d',st.dir);h.set('m',st.met);h.set('t',clockStr(curM()));if(st.sel)h.set('j',st.sel);else if(st.seg!=null)h.set('p',st.seg);try{history.replaceState(null,'','#'+h.toString())}catch(e){}}

/* ---------- data helpers ---------- */
const bandIdx={};B.forEach(b=>{(bandIdx[b.junction_id+'|'+b.direction]=bandIdx[b.junction_id+'|'+b.direction]||[]).push({a:hm(b.t_from),z:hm(b.t_to),b})});
Object.values(bandIdx).forEach(l=>l.sort((p,q)=>q.a-p.a));
function bandAt(j,dir,m){const l=bandIdx[j+'|'+dir]||[];for(const x of l)if(x.a<=m&&m<x.z)return x.b;return null}
const val=(b,met)=>b?(met==='mean'?b.delay_route_s:b.max_wait_route_s):null;
const bySig={};S.forEach(s=>bySig[s.junction_id]=s);
const timed=S.filter(s=>s.has_timing);
const GMAX={mean:0,max:0};['morning','evening'].forEach(d=>STOPS_BY[d].forEach(m=>timed.forEach(g=>{const b=bandAt(g.junction_id,d,m);if(b){GMAX.mean=Math.max(GMAX.mean,b.delay_route_s||0);GMAX.max=Math.max(GMAX.max,b.max_wait_route_s||0)}})));

/* geometry: which segment is each signal on (nearest road polyline, per direction) and how long is each segment */
const KLAT=111.2,KLON=111.2*Math.cos(12.95*Math.PI/180);
function distToPath(lon,lat,path){let best=1e9;for(let i=1;i<path.length;i++){const ax=(path[i-1][0]-lon)*KLON,ay=(path[i-1][1]-lat)*KLAT,bx=(path[i][0]-lon)*KLON,by=(path[i][1]-lat)*KLAT;const dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy;let t=L?-(ax*dx+ay*dy)/L:0;t=Math.max(0,Math.min(1,t));const px=ax+t*dx,py=ay+t*dy;best=Math.min(best,Math.hypot(px,py))}return best}
const SEGOF={morning:{},evening:{}},LEN={morning:[],evening:[]};
['morning','evening'].forEach(d=>{S.forEach(s=>{let bi=1,bd=1e9;PATHS[d].forEach((p,i)=>{const k=distToPath(s.lon,s.lat,p);if(k<bd){bd=k;bi=i+1}});SEGOF[d][s.junction_id]=bi});
 PATHS[d].forEach(p=>{let L=0;for(let i=1;i<p.length;i++)L+=Math.hypot((p[i][0]-p[i-1][0])*KLON,(p[i][1]-p[i-1][1])*KLAT);LEN[d].push(L)})});
function midPoint(path){const L=[0];for(let i=1;i<path.length;i++)L.push(L[i-1]+Math.hypot((path[i][0]-path[i-1][0])*KLON,(path[i][1]-path[i-1][1])*KLAT));const h=L[L.length-1]/2;let i=1;while(i<L.length-1&&L[i]<h)i++;const u=(h-L[i-1])/((L[i]-L[i-1])||1);return [path[i-1][0]+(path[i][0]-path[i-1][0])*u,path[i-1][1]+(path[i][1]-path[i-1][1])*u]}

/* observed segment times: mean of the 10-minute ticks inside a 30-minute step, weeks 2 and 3, weighted by n */
const OBS={};DATA.segobs.forEach(r=>{(OBS[r.direction+'|'+r.seg]=OBS[r.direction+'|'+r.seg]||{})[r.week+'|'+r.t]=r});
function obsAt(dir,seg,m){const o=OBS[dir+'|'+seg]||{};let n=0,d=0,f=0;for(const wk of ['week2','week3'])for(let k=0;k<30;k+=10){if(m+k>WIN[dir][1])continue;const r=o[wk+'|'+clockStr(m+k)];if(r){n+=r.n;d+=r.dur*r.n;f+=r.stat*r.n}}return n?{dur:d/n,stat:f/n,delay:(d-f)/n,ratio:d/f,n}:null}
function sigIn(dir,no){return S.filter(s=>SEGOF[dir][s.junction_id]===no)}
function sumSignals(dir,met,m,no){let t=0,n=0;timed.forEach(g=>{if(no!=null&&SEGOF[dir][g.junction_id]!==no)return;const v=val(bandAt(g.junction_id,dir,m),met);if(v!=null){t+=v;n++}});return {t,n}}
function tripStats(dir,m){const direct=obsAt(dir,'direct',m);let seg=0,ok=0;for(let i=1;i<=9;i++){const o=obsAt(dir,'seg0'+i,m);if(o){seg+=o.dur;ok++}}
 return {direct,seg:ok===9?seg:null,mean:sumSignals(dir,'mean',m),max:sumSignals(dir,'max',m)}}
let RMAX=1.5;['morning','evening'].forEach(d=>STOPS_BY[d].forEach(m=>{for(let i=1;i<=9;i++){const o=obsAt(d,'seg0'+i,m);if(o)RMAX=Math.max(RMAX,o.ratio)}}));
RMAX=Math.ceil(RMAX*2)/2;                       // legend end of the slowdown scale
const slowT=r=>(r-1)/(RMAX-1);

/* ---------- tooltip ---------- */
const tipEl=$('#tip');
function showTip(e,h){tipEl.innerHTML=h;tipEl.style.display='block';const w=tipEl.offsetWidth;tipEl.style.left=Math.min(e.clientX+14,innerWidth-w-10)+'px';tipEl.style.top=(e.clientY+14)+'px'}
function hideTip(){tipEl.style.display='none'}
function dotTip(s){if(!s.has_timing)return `<b>${esc(pretty(s.junction_id))}</b><br>a traffic light we have no timing data for`;
 const b=bandAt(s.junction_id,st.dir,curM()),v=val(b,st.met);return `<b>${esc(pretty(s.sheet_names))}</b><br>`+(v!=null?(st.met==='mean'?'typical wait ':'longest wait ')+'<b>'+dur(v)+'</b><br>click for details':'no timing data at this time')}
function segTip(no){const o=obsAt(st.dir,'seg0'+no,curM());return `<b>${esc(segName(st.dir,no))}</b><br>`+(o?`took ${mins(o.dur)}, normally ${mins(o.stat)}<br>click to see what slowed it down`:'no measurements')}

/* ---------- map: same CARTO Dark Matter basemap as the drive-time pages ---------- */
const map=new maplibregl.Map({container:'map',style:'https://basemaps.cartocdn.com/gl/dark-matter-nolabels-gl-style/style.json',center:[77.66,12.955],zoom:11,attributionControl:{compact:true},fadeDuration:0,dragRotate:false,pitchWithRotate:false});
map.scrollZoom.disable();
map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');
let mapReady=false;const chips=[];
const emptyFC=()=>({type:'FeatureCollection',features:[]});
function mapLabel(lon,lat,txt,cls,anchor,off){const e=document.createElement('div');e.className='lbl '+(cls||'');e.textContent=txt;new maplibregl.Marker({element:e,anchor:anchor||'left',offset:off||[10,-14]}).setLngLat([lon,lat]).addTo(map)}
const allPts=[].concat(...PATHS.morning);
mapLabel(allPts[0][0],allPts[0][1],'Jayanagar','','left',[10,16]);
mapLabel(allPts[allPts.length-1][0],allPts[allPts.length-1][1],'Whitefield','','right',[-10,-14]);
[['J0412','Silk Board'],['J0535','Marathahalli'],['J0539','Bellandur']].forEach(([id,t])=>{const s=S.find(x=>x.junction_id===id);if(s)mapLabel(s.lon,s.lat,t,'sm','left',[12,20])});
const dotAt=e=>map.queryRenderedFeatures(e.point,{layers:['core','ring']}).length>0;
const fitRoute=()=>{const bb=new maplibregl.LngLatBounds();allPts.forEach(c=>bb.extend(c));const w=innerWidth;map.fitBounds(bb,{padding:{top:w>900?210:(w<=640?230:130),bottom:w<=640?250:170,left:w<=640?46:60,right:w<=640?46:60},duration:0})};
function initLayers(){if(mapReady)return;
 map.addSource('pieces',{type:'geojson',data:emptyFC()});
 map.addLayer({id:'pieceSel',type:'line',source:'pieces',filter:['==',['get','sel'],1],layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#ffffff','line-width':12,'line-opacity':.25}});
 map.addLayer({id:'pieceLine',type:'line',source:'pieces',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':['get','c'],'line-width':4,'line-opacity':.95}});
 map.addLayer({id:'pieceHit',type:'line',source:'pieces',paint:{'line-color':'#000000','line-width':22,'line-opacity':0.01}});
 map.addSource('dots',{type:'geojson',data:emptyFC()});
 map.addLayer({id:'core',type:'circle',source:'dots',filter:['==',['get','k'],'t'],paint:{'circle-radius':7,'circle-color':['get','c'],'circle-opacity':1}});
 map.addLayer({id:'ring',type:'circle',source:'dots',filter:['!=',['get','k'],'t'],paint:{'circle-radius':5,'circle-color':'rgba(0,0,0,0)','circle-stroke-color':['get','c'],'circle-stroke-width':1.5}});
 map.addSource('sel',{type:'geojson',data:emptyFC()});
 map.addLayer({id:'sel',type:'circle',source:'sel',paint:{'circle-radius':13,'circle-color':'rgba(0,0,0,0)','circle-stroke-color':'#EEF1EA','circle-stroke-width':1.5}});
 ['core','ring'].forEach(l=>{
  map.on('mouseenter',l,()=>{map.getCanvas().style.cursor='pointer'});
  map.on('mouseleave',l,()=>{map.getCanvas().style.cursor='';hideTip()});
  map.on('mousemove',l,e=>{const f=e.features&&e.features[0];if(f)showTip(e.originalEvent,dotTip(bySig[f.properties.id]))});
  map.on('click',l,e=>{const f=e.features&&e.features[0];if(f)select(f.properties.id)})});
 map.on('mouseenter','pieceHit',()=>{map.getCanvas().style.cursor='pointer'});
 map.on('mouseleave','pieceHit',()=>{map.getCanvas().style.cursor='';hideTip()});
 map.on('mousemove','pieceHit',e=>{if(dotAt(e))return;const f=e.features&&e.features[0];if(f)showTip(e.originalEvent,segTip(f.properties.no))});
 map.on('click','pieceHit',e=>{if(dotAt(e))return;const f=e.features&&e.features[0];if(f)selectSeg(f.properties.no)});
 mapReady=true;fitRoute();updateMap();if(st.seg!=null||st.sel)focusMap(0)}
/* attach as soon as the style is ready, not after every tile has loaded */
map.on('style.load',initLayers);map.on('load',initLayers);if(map.isStyleLoaded())initLayers();

/* ---------- top-left: the three numbers ---------- */
function drawCard(){const m=curM(),t=tripStats(st.dir,m),mm=st.met==='mean';
 const start=t.direct?t.direct.dur:null,seg=t.seg,add=(mm?t.mean.t:t.max.t)/60;
 $('#card').innerHTML=`<div class="stat"><div class="k">Shown at the start</div><div class="v">${fmt(start/60,0)}<small>min</small></div><div class="s">the trip time when you set off</div></div>
 <div class="stat b"><div class="k">With segments</div><div class="v">${fmt(seg/60,0)}<small>min</small></div><div class="s">all nine stretches added up</div></div>
 <div class="stat c"><div class="k">Signals add</div><div class="v">${add<1?'<1':'+'+fmt(add,0)}<small>min</small></div><div class="s">${mm?'typical':'worst-case'} wait at red lights (${t.mean.n} of 18 lights)</div></div>`}

/* ---------- legend ---------- */
function drawLegend(){const g=GMAX[st.met];$('#legend').innerHTML=`<div class="cap">road: how slow</div><div class="rp"></div><div class="tk"><span>normal</span><span>${fmt(RMAX,1)}× slower</span></div>
 <div class="cap">dot: how long you wait</div><div class="rp"></div><div class="tk"><span>short</span><span>${dur(g)}</span></div>`}

/* ---------- right-hand analysis: short, in plain words ---------- */
function drawSide(){const p=$('#side'),m=curM();
 p.classList.toggle('compact',st.seg==null&&!st.sel);
 if(st.seg==null&&!st.sel){p.innerHTML=`<p class="hint"><b>Click a segment</b> to see what slowed it down.</p>`;return}
 if(st.seg!=null)segSide(p,m);else sigSide(p,m)}
function segSide(p,m){const no=st.seg,o=obsAt(st.dir,'seg0'+no,m),sm=sumSignals(st.dir,'mean',m,no),sx=sumSignals(st.dir,'max',m,no);
 let h=`<button class="back" id="back">← Back</button><h3>${esc(segName(st.dir,no))}</h3>`;
 if(!o){p.innerHTML=h+'<p>No measurements for this stretch at this time.</p>';$('#back').addEventListener('click',()=>selectSeg(null));return}
 const lost=o.dur-o.stat;
 if(lost<=30){h+=`<div class="lost">About normal</div><p>It took <b>${mins(o.dur)}</b>, the same as an empty road.</p><div class="verdict">Little delay here.</div>`}
 else{h+=`<div class="lost">${mins(lost)}<small>lost to traffic</small></div><p>It took <b>${mins(o.dur)}</b> instead of <b>${mins(o.stat)}</b> on an empty road.</p>`;
  let v;if(!sm.n)v='No timing data for the lights here. The delay is probably mostly traffic.';
  else{const share=sm.t/lost;v=share<.25?'Mostly traffic, not red lights.':share<.6?'Red lights and traffic share the blame.':'Mostly red lights.'}
  h+=`<div class="verdict">${v}</div>`;
  if(sm.n)h+=`<p class="small">Red lights here add about <b>${dur(sm.t)}</b>, at worst ${dur(sx.t)}.</p>`}
 p.innerHTML=h;$('#back').addEventListener('click',()=>selectSeg(null))}
function sigSide(p,m){const s=bySig[st.sel];
 let h=`<button class="back" id="back">← Back</button><h3>${esc(s.has_timing?pretty(s.sheet_names):'A light with no timing data')}</h3>`;
 const back=()=>$('#back').addEventListener('click',()=>select(null));
 if(!s.has_timing){p.innerHTML=h+'<p>We have no timing sheet for this light, so we can’t say how long you wait.</p>';back();return}
 const b=bandAt(s.junction_id,st.dir,m),vm=val(b,'mean'),vx=val(b,'max');
 if(vm==null){p.innerHTML=h+'<p>No valid timing for this light at this time.</p>';back();return}
 const rowsA=A.filter(a=>a.junction_id===s.junction_id&&a.valid&&hm(a.t_from)<=m&&m<hm(a.t_to));
 const mine=b.route_approach?rowsA.find(a=>a.approach_from===b.route_approach):null;
 h+=`<div class="lost">${dur(vm)}<small>typical wait</small></div><p>At worst you wait <b>${dur(vx)}</b>.${mine?' Each round it is green for '+dur(mine.through_green_s)+' and red for '+dur(mine.red_s)+'.':''}</p>`;
 if(!mine)h+=`<p class="small">We can’t tell which road you join here, so this averages all roads.</p>`;
 p.innerHTML=h;back()}

/* ---------- map update ---------- */
function updateMap(){if(!mapReady)return;const m=curM(),g=GMAX[st.met];
 const feats=S.map(s=>{let k,c;
  if(!s.has_timing){k='n';c='#81918E'}
  else{const v=val(bandAt(s.junction_id,st.dir,m),st.met);if(v==null){k='i';c='#F9AC75'}else{k='t';c=ramp(v/g)}}
  return {type:'Feature',geometry:{type:'Point',coordinates:[s.lon,s.lat]},properties:{id:s.junction_id,k,c}}});
 map.getSource('dots').setData({type:'FeatureCollection',features:feats});
 map.getSource('pieces').setData({type:'FeatureCollection',features:PATHS[st.dir].map((path,i)=>{const no=i+1,o=obsAt(st.dir,'seg0'+no,m);return {type:'Feature',geometry:{type:'LineString',coordinates:path},properties:{no,sel:st.seg===no?1:0,c:o?ramp(slowT(o.ratio)):'#456063'}}})});
 map.getSource('sel').setData(st.sel?{type:'FeatureCollection',features:[{type:'Feature',geometry:{type:'Point',coordinates:[bySig[st.sel].lon,bySig[st.sel].lat]},properties:{}}]}:emptyFC());
 chips.forEach(c=>c.remove());chips.length=0;
 PATHS[st.dir].forEach((path,i)=>{const no=i+1,o=obsAt(st.dir,'seg0'+no,m);if(!o)return;const e=document.createElement('div');e.className='chip';e.textContent=fmt(o.dur/60,0)+' min';e.style.borderLeftColor=ramp(slowT(o.ratio));e.addEventListener('click',ev=>{ev.stopPropagation();selectSeg(no)});
  const mp=midPoint(path);chips.push(new maplibregl.Marker({element:e,anchor:'center'}).setLngLat(mp).addTo(map))})}

function drawTimeButtons(){const h=$('#tbtns');h.innerHTML='';stops().forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.textContent=clockStr(m);if(i===st.i)b.className='on';h.appendChild(b)})}
function render(){
 st.i=Math.min(st.i,stops().length-1);drawTimeButtons();
 $('#clockT').textContent=clockStr(curM());
 [...$('#dirTog').children].forEach(b=>b.classList.toggle('on',b.dataset.d===st.dir));[...$('#metTog').children].forEach(b=>b.classList.toggle('on',b.dataset.k===st.met));
 drawCard();drawLegend();drawSide();updateMap();writeHash()}
/* keep the thing you picked in view, clear of the stats card (left) and the analysis panel (right) */
function focusMap(dur){if(!mapReady)return;const d=(dur===undefined?600:dur),w=innerWidth,pad={top:w>900?400:(w<=640?330:260),bottom:w<=640?250:170,left:w<=640?46:60,right:w<=640?46:60};
 if(st.seg!=null){const bb=new maplibregl.LngLatBounds();PATHS[st.dir][st.seg-1].forEach(c=>bb.extend(c));map.fitBounds(bb,{padding:pad,maxZoom:13,duration:d})}
 else if(st.sel){const s=bySig[st.sel],bb=new maplibregl.LngLatBounds([s.lon-.012,s.lat-.007],[s.lon+.012,s.lat+.007]);map.fitBounds(bb,{padding:pad,maxZoom:13,duration:d})}
 else{const bb=new maplibregl.LngLatBounds();allPts.forEach(c=>bb.extend(c));map.fitBounds(bb,{padding:{top:w>900?210:(w<=640?230:130),bottom:w<=640?250:170,left:w<=640?46:60,right:w<=640?46:60},duration:d})}}
function select(j){st.seg=null;st.sel=(j===st.sel?null:j);render();focusMap()}
function selectSeg(no){st.sel=null;st.seg=(no===null||no===st.seg)?null:no;render();focusMap()}

/* ---------- controls ---------- */
$('#tbtns').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;stop();st.i=+b.dataset.i;render()});
$('#dirTog').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;st.dir=b.dataset.d;st.seg=null;st.sel=null;render();focusMap()});
$('#metTog').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;st.met=b.dataset.k;render()});
function stop(){if(st.timer){clearInterval(st.timer);st.timer=null;$('#play').textContent='Play'}}
$('#play').addEventListener('click',()=>{if(st.timer){stop();return}$('#play').textContent='Pause';st.timer=setInterval(()=>{st.i=(st.i+1)%stops().length;render()},900)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(st.sel)select(null);else if(st.seg!=null)selectSeg(null)}});
render();
window.addEventListener('resize',()=>{map.resize();fitRoute()});
</script>
</body>
</html>

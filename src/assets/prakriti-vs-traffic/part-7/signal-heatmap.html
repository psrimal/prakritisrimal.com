.ctl{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:flex-end;margin:0 0 14px}
.g{display:flex;flex-direction:column;gap:6px}

.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--rule);background:var(--panel)}

.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--match);color:#000;font-weight:500}
button:focus-visible{outline:1px solid var(--match);outline-offset:2px}
#tip{position:fixed;z-index:30;pointer-events:none;display:none;background:#0B1112f2;border:1px solid var(--axis);padding:9px 11px;font-size:11.5px;line-height:1.55;color:var(--ink-2);max-width:320px}
#tip b{color:var(--ink);font-weight:500}#tip .k{color:var(--ink-3)}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:11px;color:var(--ink-3);margin:12px 0 0;align-items:center}
.sw{display:inline-block;width:11px;height:11px;vertical-align:-1px;margin-right:6px}
.note{font-size:12px;line-height:1.7;color:var(--ink-3);margin:12px 0 0}
.note b{color:var(--ink-2);font-weight:500}
.eq{font-family:var(--mono);color:var(--ink);white-space:nowrap}
</style>

const $=(s,r=document)=>r.querySelector(s);
const NS='http://www.w3.org/2000/svg';
function el(tag,a,p,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;if(p)p.appendChild(e);return e}
const fmt=(x,d=0)=>x==null||isNaN(x)?'–':Number(x).toFixed(d);
const hm=s=>{const p=s.split(':');return +p[0]*60+ +p[1]};
const pad2=n=>String(n).padStart(2,'0');
const clk=m=>pad2(Math.floor(m/60))+':'+pad2(m%60);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tipEl=$('#tip');
function showTip(e,h){tipEl.innerHTML=h;tipEl.style.display='block';const w=tipEl.offsetWidth;tipEl.style.left=Math.max(4,Math.min(e.clientX+14,innerWidth-w-8))+'px';tipEl.style.top=(e.clientY+14)+'px'}
function hideTip(){tipEl.style.display='none'}
function postH(){try{parent.postMessage({fig:'heat',h:Math.ceil(document.body.getBoundingClientRect().height)+8},'*')}catch(e){}}
if(window.ResizeObserver)new ResizeObserver(postH).observe(document.body);addEventListener('load',postH);
const vw=()=>Math.max(320,Math.min(900,Math.round(document.documentElement.clientWidth)));
function pressed(g,key){const b=$(g+' button.on');return b?b.dataset[key]:null}
function tog(g,fn){$(g).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;[...$(g).querySelectorAll('button')].forEach(x=>x.classList.toggle('on',x===b));fn()})}

const S=D.signals.filter(s=>s.has_timing).sort((a,b)=>a.km-b.km);
const WIN={morning:[420,630],evening:[1020,1230]};
const bi={};D.bands.forEach(b=>{(bi[b.junction_id+'|'+b.direction]=bi[b.junction_id+'|'+b.direction]||[]).push({a:hm(b.t_from),z:hm(b.t_to),b})});
function bandAt(j,d,m){for(const x of (bi[j+'|'+d]||[]).slice().sort((p,q)=>q.a-p.a))if(x.a<=m&&m<x.z)return x.b;return null}
const val=(b,k)=>b?(k==='mean'?b.delay_route_s:b.max_wait_route_s):null;
const MAXV={mean:0,max:0};['morning','evening'].forEach(d=>{for(let m=WIN[d][0];m<=WIN[d][1];m+=30)S.forEach(s=>{const b=bandAt(s.junction_id,d,m);if(b){MAXV.mean=Math.max(MAXV.mean,b.delay_route_s||0);MAXV.max=Math.max(MAXV.max,b.max_wait_route_s||0)}})});
const RAMP=[[0,[34,29,58]],[.55,[167,139,250]],[1,[240,234,255]]];
function ramp(t){t=Math.max(0,Math.min(1,t));for(let i=1;i<RAMP.length;i++){if(t<=RAMP[i][0]){const a=RAMP[i-1],b=RAMP[i],u=(t-a[0])/(b[0]-a[0]);return a[1].map((c,k)=>Math.round(c+(b[1][k]-c)*u))}}return RAMP[2][1]}
const ACR=new Set(['BTM','HSR','ORR','HAL','KR','JD','UCO','ESI','ITPL','BDA']);const tidy=s=>String(s||'').replace(/ J(N|unction)\.?$/i,'').split(/\s+/).map(w=>ACR.has(w.toUpperCase())?w.toUpperCase():w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ');
function tip(s,b,d,m,k){const f=(v)=>v==null?'unavailable':fmt(v,1)+' s';
 let h='<b>'+esc(s.junction_id)+' &middot; '+esc(tidy(s.sheet_names))+'</b><br><span class="k">km '+fmt(s.km,1)+' &middot; '+esc(s.basis)+'</span><br>';
 if(!b)return h+'<span class="k">no timing band covers '+clk(m)+'</span>';
 const rows=[['direction',d],['t_from',b.t_from],['t_to',b.t_to],['route_approach',b.route_approach||'unknown'],['delay_route_s',f(b.delay_route_s)],['delay_basis',b.delay_basis],['delay_allapp_mean_s',f(b.delay_allapp_mean_s)],['max_wait_route_s',f(b.max_wait_route_s)],['max_wait_allapp_s',f(b.max_wait_allapp_s)]];
 return h+rows.map(r=>'<span class="k">'+r[0]+'</span> '+esc(r[1])).join('<br>')+(b.delay_route_s==null?'<br><span class="k">band failed a cycle sanity check: shown as unavailable, not zero</span>':'')}
function draw(){const d=pressed('#dirTog','d'),k=pressed('#metTog','k');
 const cols=[];for(let m=WIN[d][0];m<=WIN[d][1];m+=30)cols.push(m);
 const rows=d==='morning'?S:S.slice().reverse();
 const W=vw(),sm=W<640,L=sm?120:250,T=sm?30:30,rh=sm?34:29,R=2,cw=(W-L-R)/cols.length,H=T+rows.length*rh+4;
 const svg=el('svg',{viewBox:'0 0 '+W+' '+H,role:'img','aria-label':'Heatmap of estimated signal delay by junction and time band'});
 const df=el('defs',{},svg);const pt=el('pattern',{id:'hat',width:6,height:6,patternUnits:'userSpaceOnUse',patternTransform:'rotate(45)'},df);el('rect',{width:6,height:6,fill:'#0B1112'},pt);el('line',{x1:0,y1:0,x2:0,y2:6,stroke:'#263535','stroke-width':2},pt);
 if(!sm)el('text',{x:L-10,y:T-10,'text-anchor':'end'},svg,'junctions in travel order');
 cols.forEach((m,i)=>{if(m%60===0||i===0)el('text',{x:L+i*cw+2,y:T-10},svg,sm?clk(m).slice(0,2):clk(m)); else if(!sm)el('text',{x:L+i*cw+2,y:T-10,opacity:.5},svg,':30')});
 rows.forEach((s,r)=>{const y=T+r*rh;
  if(sm){el('text',{x:L-6,y:y+rh/2-1,'text-anchor':'end',style:'fill:#EEF1EA'},svg,s.junction_id+' · '+fmt(s.km,1)+' km');el('text',{x:L-6,y:y+rh/2+11,'text-anchor':'end',style:'font-size:9.5px'},svg,tidy(s.sheet_names).slice(0,18))}
  else el('text',{x:L-10,y:y+rh/2+4,'text-anchor':'end',style:'fill:#EEF1EA'},svg,s.junction_id+' · '+tidy(s.sheet_names).slice(0,22)+' · '+fmt(s.km,1)+' km');
  cols.forEach((m,i)=>{const b=bandAt(s.junction_id,d,m),v=val(b,k),x=L+i*cw;
   let rect;
   if(v==null)rect=el('rect',{x:x+1,y:y+1,width:cw-2,height:rh-2,fill:'url(#hat)',stroke:'#263535'},svg);
   else{const t=v/MAXV[k],c=ramp(t);rect=el('rect',{x:x+1,y:y+1,width:cw-2,height:rh-2,fill:'rgb('+c.join(',')+')'},svg);
    el('text',{x:x+cw/2,y:y+rh/2+4,'text-anchor':'middle',style:'fill:'+(t>.5?'#101010':'#EEF1EA')+';font-size:10px'},svg,fmt(v));
    if(b.delay_basis!=='route approach')el('circle',{cx:x+cw-6,cy:y+6,r:2,fill:t>.5?'#101010':'#EEF1EA',opacity:.8},svg)}
   rect.addEventListener('mousemove',e=>showTip(e,tip(s,b,d,m,k)));rect.addEventListener('mouseleave',hideTip)})});
 $('#chart').innerHTML='';$('#chart').appendChild(svg);
 const stops=[0,.25,.5,.75,1].map(t=>'rgb('+ramp(t).join(',')+')').join(',');
 $('#legend').innerHTML='<span>'+(k==='mean'?'Mean estimated delay':'Max red-phase wait')+': 0 <span class="sw" style="width:110px;height:8px;vertical-align:middle;background:linear-gradient(90deg,'+stops+')"></span> '+fmt(MAXV[k])+' s</span>'
  +'<span><span class="sw" style="background:repeating-linear-gradient(45deg,#263535 0 2px,#0B1112 2px 5px);border:1px solid #263535"></span>unavailable (failed sanity check), not zero</span><span><span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:#A5B4B1;margin-right:6px;vertical-align:1px"></span>all-approach figure: the route approach is unknown here</span>';
 $('#eq').innerHTML=k==='mean'
  ?'<b>Mean delay</b> = <span class="eq">(C &minus; g)&sup2; / 2C</span>, where C is the cycle length and g the through-green time. It assumes vehicles arrive at random and no queue.'
  :'<b>Max red-phase wait</b> = <span class="eq">C &minus; g</span>, one full red. A single-pass ceiling, not a prediction of the wait in congested conditions. Mean and maximum are different quantities and are never added.';
 $('#eq').innerHTML+=' The 6 signals without timing sheets are not shown: their delay is unknown, not zero.';
 postH()}
tog('#dirTog',draw);tog('#metTog',draw);draw();addEventListener('resize',draw);

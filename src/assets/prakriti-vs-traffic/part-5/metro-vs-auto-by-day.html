<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metro vs Auto, by weekday</title>
<meta name="description" content="Average door-to-desk time for the metro's quickest chain versus the direct auto, by weekday, across weeks 2 and 3.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#000000;
  --ink:#f0ede4;
  --muted:#7f8c83;
  --line:#1a241d;
  --axis:#2f3f35;
  --accent:#2db354;
  --metro:#A6F8C4;
  --auto:#F9AC75;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-weight:300;
  font-size:1.0625rem;line-height:1.8;
  -webkit-font-smoothing:antialiased;
}
.wrap{width:100%;padding:.2rem 0 .4rem}

.toggle{display:flex;gap:1.6rem;margin:0 0 1rem}
.toggle button{
  appearance:none;-webkit-appearance:none;background:none;border:0;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);padding:.2rem 0 .45rem;cursor:pointer;transition:color .2s ease,border-color .2s ease;
}
.toggle button:hover{color:var(--ink)}
.toggle button[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.toggle button:focus-visible{outline:1px solid var(--accent);outline-offset:2px}

.chart{width:100%}
svg{display:block;overflow:visible}
svg text{font-family:var(--mono)}
.tick text{fill:var(--muted);font-size:10px}
.tick line{stroke:var(--line)}
.domain{display:none}
.pnote{fill:var(--muted);font-size:10px}
.cat{fill:var(--muted);font-size:10px}
.val{fill:var(--ink);font-size:10px}

.legend{display:flex;gap:1.6rem;margin:.6rem 0 1.2rem;font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:.5rem}
.legend b{width:10px;height:10px;border-radius:2px;display:inline-block}

figcaption{
  font-family:var(--mono);font-size:.72rem;line-height:1.65;
  color:var(--muted);margin-top:.9rem;
}
figcaption b{
  color:var(--accent);font-weight:500;letter-spacing:.18em;
  text-transform:uppercase;font-size:.68rem;margin-right:.75rem;
}
figcaption .live{display:block;margin-top:.5rem;color:var(--ink)}

@media (max-width:600px){
  body{font-size:1rem}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="toggle" role="group" aria-label="Window">
    <button type="button" id="btn-m" aria-pressed="true">Morning</button>
    <button type="button" id="btn-e" aria-pressed="false">Evening</button>
  </div>
  <div class="legend">
    <span><b style="background:var(--metro)"></b>Metro, quickest chain</span>
    <span><b style="background:var(--auto)"></b>Auto, direct</span>
  </div>
  <figure style="margin:0">
    <div class="chart"></div>
    <figcaption><b>Fig 10</b>Average door-to-desk time by weekday, across weeks 2 and 3.<span class="live"></span></figcaption>
  </figure>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
/* [metroAvgMin, autoAvgMin, n] per weekday, Mon-Fri, averaged across weeks 2 and 3 */
const STATS = {
  morning: [[73,79.8,56],[75.5,87.1,56],[74.8,84.8,56],[74.2,75.6,56],[73.1,62.3,56]],
  evening: [[82.3,80.9,44],[83.3,95.3,44],[83.3,93.2,44],[82.7,97.8,44],[83.8,98.5,44]]
};
const DAYS = ['Mon','Tue','Wed','Thu','Fri'];
const DAYFULL = ['Monday','Tuesday','Wednesday','Thursday','Friday'];
const ACCENT = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
const MUTED = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim();
const AXIS = getComputedStyle(document.documentElement).getPropertyValue('--axis').trim();
const METRO = getComputedStyle(document.documentElement).getPropertyValue('--metro').trim();
const AUTO = getComputedStyle(document.documentElement).getPropertyValue('--auto').trim();

const chart = document.querySelector('.chart');
const live = document.querySelector('.live');
let win = 'morning', lastW = 0;

function yGrid(g, y, pw, n){
  const ax = g.append('g').call(d3.axisLeft(y).ticks(n || 5).tickSize(-pw));
  ax.select('.domain').remove();
  ax.selectAll('.tick text').attr('x', -8);
  return ax;
}

function render(){
  const w = Math.max(280, Math.round(chart.clientWidth));
  lastW = w;
  const h = w < 560 ? 340 : 300;
  chart.innerHTML = '';
  const svg = d3.select(chart).append('svg').attr('width', w).attr('height', h).attr('viewBox', `0 0 ${w} ${h}`);
  const ml = 34, mr = 8, top = 14, bot = 30, pw = w - ml - mr, ph = h - top - bot;
  const g = svg.append('g').attr('transform', `translate(${ml},${top})`);
  const rows = STATS[win];
  const maxV = Math.ceil(Math.max(...rows.flatMap(r => [r[0], r[1]])) / 10) * 10;
  const y = d3.scaleLinear([0, maxV], [ph, 0]);
  const x0 = d3.scaleBand(DAYS, [0, pw]).paddingInner(.3).paddingOuter(.15);
  const x1 = d3.scaleBand(['metro','auto'], [0, x0.bandwidth()]).padding(.12);
  yGrid(g, y, pw, 5);
  g.append('text').attr('class','pnote').attr('x',0).attr('y',-4).text('avg time, minutes');

  const tip = fig => { live.textContent = fig; };
  DAYS.forEach((d, k) => {
    g.append('text').attr('class','cat').attr('x',x0(d)+x0.bandwidth()/2).attr('y',ph+18).attr('text-anchor','middle').text(d);
    const [metro, auto, n] = rows[k];
    [['metro', metro, METRO], ['auto', auto, AUTO]].forEach(([key, v, col]) => {
      g.append('rect').attr('x',x0(d)+x1(key)).attr('width',x1.bandwidth()).attr('y',y(v)).attr('height',ph-y(v))
        .attr('fill', col)
        .on('pointerenter pointermove', () => tip(`${DAYFULL[k]}, ${win}: ${key === 'metro' ? 'metro' : 'auto'} ${v.toFixed(1)} min, n = ${n}`))
        .on('pointerleave', () => tip(''));
      g.append('text').attr('class','val').attr('x',x0(d)+x1(key)+x1.bandwidth()/2).attr('y',y(v)-6).attr('text-anchor','middle').text(v.toFixed(1));
    });
  });
}

function setWindow(w){
  win = w;
  document.getElementById('btn-m').setAttribute('aria-pressed', w === 'morning');
  document.getElementById('btn-e').setAttribute('aria-pressed', w === 'evening');
  render();
  send();
}
document.getElementById('btn-m').onclick = () => setWindow('morning');
document.getElementById('btn-e').onclick = () => setWindow('evening');

new ResizeObserver(() => { if (Math.round(chart.clientWidth) !== lastW) { render(); send(); } }).observe(chart);
render();

function send(){
  const h = Math.ceil(document.documentElement.getBoundingClientRect().height);
  parent.postMessage({fig:'dayfig', h}, '*');
}
window.addEventListener('load', function(){ send(); setTimeout(send,400); setTimeout(send,1200); });
window.addEventListener('resize', send);
</script>
</body>
</html>

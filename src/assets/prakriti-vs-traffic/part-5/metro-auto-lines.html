<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metro or auto, every single departure</title>
<meta name="description" content="Door-to-door time of the fastest metro option against the direct auto drive for every ten-minute departure, week 3.">
<style>
  :root{
    --bg:#000; --ink:#EEF1EA; --ink-2:#A5B4B1; --ink-3:#81918E; --grid:#1d2626; --axis:#456063; --panel:#0B1112;
    --metro:#A6F8C4; --auto:#F9AC75; --head:#2fbf5f;
    --mono:'JetBrains Mono','Roboto Mono',ui-monospace,Consolas,monospace; --sans:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
  main{padding:4px 0 10px}
  .m{color:var(--metro)} .a{color:var(--auto)}
  .panel{margin:18px 0 6px;position:relative}
  .ptitle{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--ink);margin-bottom:2px}
  .key{color:var(--ink-3);display:flex;gap:16px;align-items:center}
  .key i{display:inline-block;width:18px;height:0;border-top:2px solid currentColor;vertical-align:middle;margin-right:6px}
  svg{display:block;width:100%;height:auto;overflow:visible}
  svg text{font-family:var(--mono);font-size:10.5px;fill:var(--ink-3)}
  svg .day{fill:var(--ink-2)}
  .read{font-family:var(--mono);font-size:12.5px;color:var(--ink);margin:6px 0 0;line-height:1.6}
  .read span{color:var(--ink-3)}
  #tip{position:fixed;z-index:10;pointer-events:none;display:none;background:#0B1112f2;border:1px solid var(--axis);padding:9px 11px;font-family:var(--mono);font-size:11.5px;line-height:1.55;color:var(--ink-2);max-width:280px}
  #tip .v{color:var(--ink);font-weight:500;font-size:14px}
  #tip .k{display:inline-block;width:12px;border-top:2px solid currentColor;vertical-align:middle;margin-right:6px}

  /* day-picker slider, same convention as the rest of the series */
  .stops{margin:1rem 0 0;--n:6}
  .stop-labels{display:grid;grid-template-columns:repeat(var(--n),1fr)}
  .stop-labels button{
    appearance:none;-webkit-appearance:none;background:none;border:0;border-radius:0;
    font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-3);text-align:center;padding:.35rem 0 0;cursor:pointer;line-height:1.35;
    transition:color .2s ease;
  }
  .stop-labels button::after{
    content:"";display:block;width:1px;height:6px;margin:.4rem auto 0;
    background:var(--grid);transition:background .2s ease;
  }
  .stop-labels button:hover{color:var(--ink)}
  .stop-labels button[aria-current="true"]{color:var(--head)}
  .stop-labels button[aria-current="true"]::after{background:var(--head)}
  .stop-labels button:focus-visible{outline:1px solid var(--head);outline-offset:2px}
  input[type="range"].dayrange{
    -webkit-appearance:none;appearance:none;background:transparent;cursor:grab;touch-action:none;
    display:block;height:12px;margin:0 0 0;padding:0;
    width:calc(100% * (var(--n) - 1) / var(--n) + 12px);
    margin-left:calc(100% / (2 * var(--n)) - 6px);
  }
  input[type="range"].dayrange:active{cursor:grabbing}
  input[type="range"].dayrange::-webkit-slider-runnable-track{height:1px;background:var(--axis)}
  input[type="range"].dayrange::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:12px;height:12px;
    border-radius:50%;background:var(--head);border:0;
    margin-top:calc((1px - 12px) / 2);
  }
  input[type="range"].dayrange::-moz-range-track{height:1px;background:var(--axis)}
  input[type="range"].dayrange::-moz-range-thumb{
    width:12px;height:12px;border-radius:50%;background:var(--head);border:0;
  }
  input[type="range"].dayrange:focus-visible{outline:1px solid var(--head);outline-offset:6px}
</style>
</head>
<body>
<main>
  <div id="root"></div>
  <div class="stops">
    <input type="range" class="dayrange" min="0" max="5" value="0" step="1" aria-label="Day">
    <div class="stop-labels"></div>
  </div>
</main>

      if (d0 * d1 >= 0) seg(x(a[0]), x(b[0]), a[1], b[1], a[2], b[2], d0 + d1 >= 0);
      else {
        const u = d0 / (d0 - d1), xc = x(a[0]) + u * (x(b[0]) - x(a[0])), yc = a[1] + u * (b[1] - a[1]);
        seg(x(a[0]), xc, a[1], yc, a[2], yc, d0 > 0); seg(xc, x(b[0]), yc, b[1], yc, b[2], d1 > 0);
      }
    }
    const path = (idx, color) => {
      let dstr = "", pen = false;
      pts.forEach(p => { if (p[idx] == null){ pen = false; return; } dstr += (pen ? "L" : "M") + x(p[0]).toFixed(1) + "," + y(p[idx]).toFixed(1); pen = true; });
      el("path", {d:dstr, fill:"none", stroke:color, "stroke-width":1.3, "stroke-linejoin":"round", "stroke-linecap":"round"}, g);
    };
    path(1, "var(--auto)"); path(2, "var(--metro)");
  });
  el("line", {x1:m.l, x2:W - m.r, y1:m.t + ph, y2:m.t + ph, stroke:"var(--axis)"}, svg);
  // hover: crosshair snaps to the nearest reading of the day under the pointer
  const cross = el("line", {y1:m.t, y2:m.t + ph, stroke:"var(--ink-2)", "stroke-width":1, visibility:"hidden"}, svg);
  const dotA = el("circle", {r:3.5, fill:"var(--auto)", stroke:"var(--bg)", "stroke-width":2, visibility:"hidden"}, svg);
  const dotM = el("circle", {r:3.5, fill:"var(--metro)", stroke:"var(--bg)", "stroke-width":2, visibility:"hidden"}, svg);
  const hit = el("rect", {x:m.l, y:m.t, width:pw, height:ph, fill:"transparent"}, svg);
  hit.addEventListener("pointermove", ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width, di = Math.max(0, Math.min(days.length - 1, Math.floor((px - m.l) / cw)));
    const x0 = m.l + di * cw, pts = days[di][d.key]; let best = 0, bd = 1e9;
    pts.forEach((p, i) => { const dx = Math.abs(x0 + 3 + (p[0] - d.start) / (d.end - d.start) * (cw - 6) - px); if (dx < bd){ bd = dx; best = i; } });
    const p = pts[best], cx = x0 + 3 + (p[0] - d.start) / (d.end - d.start) * (cw - 6);
    cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("visibility", "visible");
    dotA.setAttribute("cx", cx); dotA.setAttribute("cy", y(p[1])); dotA.setAttribute("visibility", "visible");
    if (p[2] != null){ dotM.setAttribute("cx", cx); dotM.setAttribute("cy", y(p[2])); dotM.setAttribute("visibility", "visible"); } else dotM.setAttribute("visibility", "hidden");
    const diff = p[2] == null ? "" : (p[1] - p[2] >= 0 ? `<br>metro quicker by <b class="v" style="font-size:12px">${(p[1] - p[2]).toFixed(0)} min</b>` : `<br>auto quicker by <b class="v" style="font-size:12px">${(p[2] - p[1]).toFixed(0)} min</b>`);
    showTip(ev, `<div>${esc(days[di].name.split(" ")[0])} &#183; leaves ${fmt(p[0])}</div>` +
      `<div><span class="k" style="color:var(--metro)"></span><span class="v">${p[2] == null ? "–" : p[2].toFixed(0) + " min"}</span> metro${p[3] ? "<br>&nbsp;&nbsp;&nbsp;&nbsp;" + esc(p[3]) + " &#8594; " + esc(p[4]) : ""}</div>` +
      `<div><span class="k" style="color:var(--auto)"></span><span class="v">${p[1].toFixed(0)} min</span> auto, direct</div>${diff}`);
  });
  hit.addEventListener("pointerleave", () => { hideTip(); [cross, dotA, dotM].forEach(n => n.setAttribute("visibility", "hidden")); });

  return function setDim(selected){
    dayGroups.forEach((g, di) => g.setAttribute("opacity", selected == null || selected === di ? 1 : .22));
  };
}

const setters = [];

function render(){
  const root = $("#root"); root.innerHTML = ""; setters.length = 0;
  DATA.weeks.forEach(week => {
    DIRS.forEach(d => {
      const box = document.createElement("div"); box.className = "panel"; root.appendChild(box);
      const t = document.createElement("div"); t.className = "ptitle";
      t.innerHTML = `<span>${d.name} &#183; ${d.sub}</span><span class="key"><span style="color:var(--metro)"><i></i>metro, quickest option</span><span style="color:var(--auto)"><i></i>auto, direct drive</span></span>`;
      box.appendChild(t);
      const host = document.createElement("div"); box.appendChild(host);
      setters.push(panel(week, d, host));
      let n = 0, mq = 0;
      week.days.forEach(day => day[d.key].forEach(p => { if (p[2] == null) return; n++; if (p[2] < p[1]) mq++; }));
      const r = document.createElement("p"); r.className = "read";
      r.innerHTML = `${d.name}: metro was quicker in <b>${mq}</b> of ${n} readings <span>(${n ? Math.round(100 * mq / n) : 0}%)</span>.`;
      box.appendChild(r);
    });
  });
  applyDim(current);
}

const dayStops = ["All", ...DATA.weeks[0].days.map(d => d.name.split(" ")[0])];
let current = null;
function applyDim(sel){ setters.forEach(fn => fn(sel)); }

(function initSlider(){
  const range = document.querySelector(".dayrange");
  const labels = document.querySelector(".stop-labels");
  range.max = dayStops.length - 1;
  dayStops.forEach((s, k) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = s;
    b.setAttribute("aria-current", k === 0);
    b.onclick = () => set(k);
    labels.appendChild(b);
  });
  function set(k){
    current = k === 0 ? null : k - 1;
    range.value = k;
    [...labels.children].forEach((b, j) => b.setAttribute("aria-current", j === k));
    hideTip(); applyDim(current); send();
  }
  range.addEventListener("input", () => set(+range.value));
})();

render();
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { render(); send(); }, 150); });

function send(){
  const h = Math.ceil(document.documentElement.getBoundingClientRect().height);
  parent.postMessage({fig:"autolines", h}, "*");
}
window.addEventListener("load", function(){ send(); setTimeout(send,400); setTimeout(send,1200); });
</script>

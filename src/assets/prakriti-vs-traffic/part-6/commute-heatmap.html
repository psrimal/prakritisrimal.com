<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commute heatmap: when congestion builds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#000000; --panel:#0B1112; --ink:#EEF1EA; --ink-2:#A5B4B1; --ink-3:#81918E; --grid:#1d2626; --axis:#456063; --rule:#263535;
    --brand:#A6F8C4; --hot:#E34948; --auto:#F9AC75;
    --mono:'Roboto Mono',ui-monospace,Consolas,monospace; --display:'Poppins',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono)}
  /* controls: one bar fixed at the bottom */
  .ctrl{position:fixed;left:0;right:0;bottom:0;z-index:25;background:linear-gradient(to top,rgba(0,0,0,.97),rgba(0,0,0,.78) 70%,transparent);padding:16px 28px;display:flex;flex-wrap:wrap;gap:16px 22px;align-items:flex-end}
  .ctl{display:flex;flex-direction:column;gap:6px}
  .ctl>label{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);line-height:1;white-space:nowrap}
  .ctl .val{color:var(--ink);font-weight:500}
  .seg{display:inline-flex;border:1px solid var(--rule);background:var(--panel);height:40px}
  .seg button{background:none;border:0;color:var(--ink-2);font-family:var(--mono);font-size:11px;letter-spacing:.14em;height:38px;padding:0 14px;cursor:pointer;text-transform:uppercase}
  .seg button.on{background:var(--brand);color:var(--bg);font-weight:500}
  input[type=range]{accent-color:var(--brand);width:260px;height:40px;margin:0;display:block}
  .play{background:var(--brand);color:var(--bg);border:0;font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.14em;height:40px;padding:0 24px;cursor:pointer;text-transform:uppercase}
  .play:hover{background:#c5fcd9}
  .ghost{background:transparent;color:var(--ink-2);border:1px solid var(--rule);font-family:var(--mono);font-size:11px;letter-spacing:.14em;height:40px;padding:0 16px;cursor:pointer;text-transform:uppercase}
  .ghost:hover{border-color:var(--axis);color:var(--ink)}
  svg{display:block;width:100%;height:auto;overflow:visible}
  svg text{font-family:var(--mono);font-size:10.5px;fill:var(--ink-3)}
  #tip{position:fixed;z-index:30;pointer-events:none;display:none;background:#0B1112f2;border:1px solid var(--axis);padding:9px 11px;font-size:11.5px;line-height:1.55;color:var(--ink-2);max-width:290px}
  #tip .v{color:var(--ink);font-weight:500;font-size:14px}
  /* colour legend for the slowdown ramp */
  .lg{position:relative;width:228px;font-size:10px;color:var(--ink-3)}
  .lg .cap{margin-bottom:6px;letter-spacing:.08em}
  .lg .ramp{display:block;height:8px;width:calc(100% - 28px);margin:0 14px}
  .lg .tk{position:relative;height:14px;margin:3px 14px 0;width:calc(100% - 28px)}
  .lg .tk span{position:absolute;transform:translateX(-50%);white-space:nowrap}
  @media(max-width:900px){.ctrl{padding:12px 16px;gap:12px} input[type=range]{width:180px}}
  /* day slider, in the style of the sliders page: a thin line, a round thumb, and every stop labelled (and clickable) underneath */
  .dayslider{--n:6;--thumb:12px;width:100%;margin-top:18px}
  .dayslider input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;cursor:grab;display:block;height:var(--thumb);margin:0 0 0 calc(100% / (2 * var(--n)) - var(--thumb) / 2);padding:0;
    width:calc(100% * (var(--n) - 1) / var(--n) + var(--thumb))}
  .dayslider input[type=range]:active{cursor:grabbing}
  .dayslider input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--axis)}
  .dayslider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:var(--thumb);height:var(--thumb);border-radius:50%;background:var(--brand);border:0;margin-top:calc((1px - var(--thumb)) / 2)}
  .dayslider input[type=range]::-moz-range-track{height:1px;background:var(--axis)}
  .dayslider input[type=range]::-moz-range-thumb{width:var(--thumb);height:var(--thumb);border-radius:50%;background:var(--brand);border:0}
  .dayslider .stop-labels{display:grid;grid-template-columns:repeat(var(--n),1fr);margin-top:2px}
  .dayslider .stop-labels button{appearance:none;-webkit-appearance:none;background:none;border:0;border-radius:0;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:center;padding:6px 0 0;cursor:pointer;transition:color .2s}
  .dayslider .stop-labels button::after{content:"";display:block;width:1px;height:6px;margin:6px auto 0;background:var(--rule);transition:background .2s}
  .dayslider .stop-labels button:hover{color:var(--ink)}
  .dayslider .stop-labels button[aria-current="true"]{color:var(--brand)}
  .dayslider .stop-labels button[aria-current="true"]::after{background:var(--brand)}
  .dayslider .stop-labels button:focus-visible{outline:1px solid var(--brand);outline-offset:2px}
  .dayslider .cap{font-size:11px;color:var(--ink-3);text-align:center;margin-top:8px;letter-spacing:.06em}

  html,body{height:100%;overflow:hidden}
  main{position:absolute;left:0;right:0;top:24px;bottom:30px;display:flex;justify-content:center;align-items:flex-start}
  .wrap{width:min(calc(100% - 56px), 1100px);height:100%;max-height:720px;display:flex;flex-direction:column}
  #heat{flex:1;min-height:0}
  .top{display:flex;justify-content:flex-start;padding-bottom:10px}
  svg{height:100%}
  .legend{position:fixed;z-index:20;right:20px;bottom:30px;background:rgba(11,17,18,.9);border:1px solid var(--rule);padding:10px 12px}
  svg rect.cell{cursor:pointer}
  @media(max-width:900px){.legend{display:none}}

  @media(max-width:640px){
    html,body{height:auto;overflow:visible}
    main{position:static;display:block;padding:12px 0 10px}
    .wrap{width:calc(100% - 24px);height:auto;max-height:none;margin:0 auto;display:block}
    #heat{height:340px}
    .dayslider .stop-labels button{font-size:9px;letter-spacing:.04em}
    .legend{display:block;position:static;margin:14px 0 0;width:100%}
    .top{flex-direction:column;align-items:flex-start;gap:10px}
    .key{flex-wrap:wrap;gap:6px 16px;justify-content:flex-start}
  }
</style>
</head>
<body>
<main><div class="wrap"><div class="top"><div class="seg" id="seg-dir"><button data-v="morning" class="on">Morning</button><button data-v="evening">Evening</button></div></div><div id="heat"></div><div class="dayslider" id="dayblock"></div></div></main>
<div class="legend lg" id="legend"></div>
<div id="tip"></div>

const $ = s => document.querySelector(s);
const SVGNS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent) => { const n = document.createElementNS(SVGNS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clamp = (x,a,b) => Math.max(a,Math.min(b,x));
const mn = s => s/60;
function quant(arr, q){ const a = arr.filter(v => v != null).sort((x,y) => x-y); if (!a.length) return null; const i = (a.length-1)*q, lo = Math.floor(i), hi = Math.ceil(i); return a[lo] + (a[hi]-a[lo])*(i-lo); }
function mean(arr){ const a = arr.filter(v => v != null); return a.length ? a.reduce((x,y) => x+y, 0) / a.length : null; }
const SEGN = DATA.segments;                  // piece names, physical order (morning travel order)

// ---- per-direction view: physical piece p (0 = Tilak Nagar end) at every day and departure slot ----
const V = {};
for (const dir of ["morning","evening"]) {
  const g = DATA[dir], morning = dir === "morning";
  const days = g.days.map(d => ({label:d.label, week:d.week, ticks:d.ticks.map(t => ({
    t:t.t, direct:t.direct, segs:t.segs ? (morning ? t.segs.slice() : t.segs.slice().reverse()) : null }))}));   // evening piece i of the trip is physical piece 8-i
  const slots = days[0].ticks.map(t => t.t);
  const base = [];                              // each piece's own quickest (10th percentile) time over all ten days, seconds
  for (let p = 0; p < 9; p++) base.push(quant(days.flatMap(d => d.ticks.map(t => t.segs ? t.segs[p] : null)), .1));
  const order = morning ? [0,1,2,3,4,5,6,7,8] : [8,7,6,5,4,3,2,1,0];   // top to bottom in the direction of travel
  let lastSeg = 0; slots.forEach((_, i) => { if (days.filter(d => d.ticks[i].segs).length >= 2) lastSeg = i; });   // last departure where at least 2 of the 10 days have piece-by-piece times
  V[dir] = {g, days, slots, base, order, lastSeg};
}

// ---- colour: slowdown against the piece's own quickest time (one function for map, list, heatmap and legend) ----
const RAMP = [[1.0,"#20393a"],[1.3,"#3f8f63"],[1.6,"#F2D26B"],[2.0,"#F9AC75"],[2.6,"#E34948"]];
const RMIN = RAMP[0][0], RMAX = RAMP[RAMP.length-1][0];
const hex = h => [1,3,5].map(i => parseInt(h.substr(i,2),16));
function ratioColor(r){
  if (r == null) return "#141c1d";
  r = clamp(r, RMIN, RMAX);
  for (let i = 1; i < RAMP.length; i++) if (r <= RAMP[i][0]) {
    const a = RAMP[i-1], b = RAMP[i], u = (r-a[0])/(b[0]-a[0]), ca = hex(a[1]), cb = hex(b[1]);
    return "rgb(" + ca.map((c,k) => Math.round(c+(cb[k]-c)*u)).join(",") + ")";
  }
  return RAMP[RAMP.length-1][1];
}
// the legend ramp puts every stop at its true position, so the bar shows exactly the colours the marks use
function legendHtml(){
  const pos = r => ((r - RMIN) / (RMAX - RMIN) * 100).toFixed(1);
  return `<div class="cap">slowdown vs quickest</div><i class="ramp" style="background:linear-gradient(90deg,${RAMP.map(s => s[1] + " " + pos(s[0]) + "%").join(",")})"></i>` +
    `<div class="tk">${RAMP.map(s => `<span style="left:${pos(s[0])}%">${s[0]}×</span>`).join("")}</div>`;
}

// ---- tooltip ----
const tip = $("#tip");
const showTip = (ev, html) => { tip.innerHTML = html; tip.style.display = "block"; tip.style.left = Math.min(ev.clientX + 16, innerWidth - 310) + "px"; tip.style.top = (ev.clientY + 16) + "px"; };
const hideTip = () => { tip.style.display = "none"; };

// ---- departure control shared by the pages ----
let playTimer = null;
function wirePlay(S, onSlot){
  // like the other pages: Play runs the departures through the window; once started the button reads Restart; Skip jumps to the end
  const stop = () => { S.playing = false; clearInterval(playTimer); };
  $("#btn-play").addEventListener("click", () => {
    stop(); const n = S.n || V[S.dir].slots.length;
    S.slot = 0; $("#sl").value = 0; onSlot();
    S.playing = true; $("#btn-play").textContent = "Restart";
    playTimer = setInterval(() => { S.slot++; if (S.slot >= n - 1) { S.slot = n - 1; stop(); } $("#sl").value = S.slot; onSlot(); }, 550);
  });
  $("#btn-skip").addEventListener("click", () => { stop(); S.slot = (S.n || V[S.dir].slots.length) - 1; $("#sl").value = S.slot; $("#btn-play").textContent = "Restart"; onSlot(); });
  $("#sl").addEventListener("input", e => { S.slot = +e.target.value; onSlot(); });
}
// pieceOnly: the page only has piece-by-piece times, so it stops at the last departure that has them (the direct drive was read until the end of the window)
function setDirCommon(S, dir, onChange, pieceOnly){
  S.dir = dir; document.querySelectorAll("#seg-dir button").forEach(b => b.classList.toggle("on", b.dataset.v === dir));
  const n = pieceOnly ? V[dir].lastSeg + 1 : V[dir].slots.length; S.n = n; if ($("#sl")) $("#sl").max = n - 1;
  S.slot = clamp(V[dir].slots.indexOf(dir === "morning" ? "08:30" : "18:00"), 0, n - 1) || Math.floor(n / 2); if ($("#sl")) $("#sl").value = S.slot;
  onChange();
}

// ---- each weekday averaged over the two weeks (week 2 + week 3 of the same weekday), the form every page's day control uses ----
const DAYN = ["Mon","Tue","Wed","Thu","Fri"];
function avgDay(v, d){
  const a = v.days[d], b = v.days[5 + d], sum = t => t.segs ? t.segs.reduce((x, y) => x + y, 0) : null;
  return a.ticks.map((t, s) => { const u = b.ticks[s];       // a piece time averages whichever of the two weeks have it
    return {t:t.t, direct:mean([t.direct, u.direct]), segs:(t.segs || u.segs) ? [0,1,2,3,4,5,6,7,8].map(p => mean([t.segs ? t.segs[p] : null, u.segs ? u.segs[p] : null])) : null, total:mean([sum(t), sum(u)])}; });
}
for (const dir in V) V[dir].avg = [0,1,2,3,4].map(d => avgDay(V[dir], d));
const dayText = dayk => (dayk === "all" ? "typical Mon–Fri" : "typical " + DAYN[+dayk]) + " · weeks 2 + 3";
const dayCols = dayk => dayk === "all" ? [0,1,2,3,4] : [+dayk];

// all five weekdays together (Mon-Fri, weeks 2 + 3): the 'typical' stop of the day slider
for (const dir in V) {
  const v = V[dir], n = v.slots.length;
  v.avgAll = Array.from({length:n}, (_, s) => { const col = v.avg.map(day => day[s]);
    return {t:col[0].t, direct:mean(col.map(t => t.direct)), segs:col.some(t => t.segs) ? [0,1,2,3,4,5,6,7,8].map(p => mean(col.map(t => t.segs ? t.segs[p] : null))) : null, total:mean(col.map(t => t.total))}; });
}
const dayData = (v, dayk) => dayk === "all" ? v.avgAll : v.avg[+dayk];
// day slider: stop 0 is "All" = Mon-Fri typical, stops 1..5 are Mon..Fri; each stop label is also a button
const DAYSTOPS = ["all", 0, 1, 2, 3, 4];
function dayBlockHtml(){
  return `<input type="range" id="sl-day" min="0" max="5" step="1" value="0" aria-label="Day"><div class="stop-labels" id="day-stops">` +
    ["All", ...DAYN].map((t, i) => `<button type="button" data-i="${i}">${t}</button>`).join("") + `</div><div class="cap" id="day-cap"></div>`;
}
function wireDaySlider(S, onChange){
  const sl = $("#sl-day"), btns = document.querySelectorAll("#day-stops button");
  const sync = () => { S.dayk = DAYSTOPS[+sl.value]; btns.forEach((b, i) => b.setAttribute("aria-current", i === +sl.value ? "true" : "false")); $("#day-cap").textContent = dayText(S.dayk); };
  sl.addEventListener("input", () => { sync(); onChange(); });
  btns.forEach((b, i) => b.addEventListener("click", () => { sl.value = i; sync(); onChange(); }));
  sync();
}

const S = {dir:"morning", dayk:"all", slot:0, playing:false};   // slot is unused here: the x-axis itself shows the departure times
$("#legend").innerHTML = legendHtml();
$("#dayblock").innerHTML = dayBlockHtml();
let GEO = null;

// One heatmap for the day chosen on the day slider (Mon-Fri = all five weekdays together; each weekday is the average of the two weeks):
// a row per road piece in travel order, a column per departure.
function render(){
  const v = V[S.dir], host = $("#heat"); host.innerHTML = ""; const day = dayData(v, S.dayk), n = S.n;
  const W = Math.max(300, host.clientWidth), H = Math.max(320, host.clientHeight);
  const m = {l:W < 760 ? 120 : 190, r:4, t:40, b:6}, pw = W - m.l - m.r, ph = H - m.t - m.b, cw = pw / n, rh = ph / 9;
  const svg = el("svg", {viewBox:`0 0 ${W} ${H}`, role:"img", "aria-label":"Slowdown of each road segment by departure time"}, host);
  svg.style.height = H + "px";
  v.order.forEach((p, r) => {
    const name = SEGN[p].short, maxc = Math.floor((m.l - 12) / 7);
    el("text", {x:m.l - 10, y:m.t + r*rh + rh/2 + 4, "text-anchor":"end", style:"font-size:12px;fill:var(--ink-2)"}, svg).textContent = name.length > maxc ? name.slice(0, maxc-1) + "…" : name;
    for (let s = 0; s < n; s++) {
      const val = day[s].segs ? day[s].segs[p] : null, ratio = val == null ? null : val / v.base[p];
      const rect = el("rect", {class:"cell", x:m.l + s*cw + .4, y:m.t + r*rh + .5, width:Math.max(1, cw - .8), height:rh - 1, fill:ratioColor(ratio)}, svg);
      rect.addEventListener("pointermove", ev => showTip(ev, `<div>${esc(dayText(S.dayk))} · leaves ${v.slots[s]}</div><div>${esc(SEGN[p].short)}</div>` +
        (val == null ? `<div>no reading</div>` : `<div><span class="v">${mn(val).toFixed(1)} min</span> · ${ratio.toFixed(2)}× its quickest (${mn(v.base[p]).toFixed(1)} min)</div>`)));
      rect.addEventListener("pointerleave", hideTip);
    }
  });
  const every = Math.max(1, Math.ceil(46 / cw));
  v.slots.slice(0, n).forEach((t, s) => { if (s % every === 0) el("text", {x:m.l + (s+.5)*cw, y:m.t - 9, "text-anchor":"middle"}, svg).textContent = t; });
  // the white line follows the pointer across the time axis (snapping to a departure) and stays where it was left; its time is read out on top
  const cur = el("line", {y1:m.t - 4, y2:m.t + ph + 3, stroke:"#EEF1EA", "stroke-width":2, "pointer-events":"none"}, svg);
  const lab = el("text", {y:14, "text-anchor":"middle", style:"fill:#EEF1EA;font-size:13px;font-weight:500"}, svg);
  GEO = {m, cw, cur, lab};
  svg.addEventListener("pointermove", ev => { const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    if (px < m.l || px > m.l + pw) return; S.slot = clamp(Math.floor((px - m.l) / cw), 0, n - 1); moveCursor(); });
  moveCursor();
}
function moveCursor(){
  if (!GEO) return; const x = GEO.m.l + (S.slot + .5) * GEO.cw; GEO.cur.setAttribute("x1", x); GEO.cur.setAttribute("x2", x);
  GEO.lab.setAttribute("x", x); GEO.lab.textContent = V[S.dir].slots[S.slot];
}
document.querySelectorAll("#seg-dir button").forEach(b => b.addEventListener("click", () => setDirCommon(S, b.dataset.v, render, true)));
wireDaySlider(S, render);
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 150); });
setDirCommon(S, "morning", render, true);
</script>

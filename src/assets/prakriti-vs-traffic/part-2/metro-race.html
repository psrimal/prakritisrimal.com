<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metro Race</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Roboto+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<style>
  :root{
    --void:#060A0B; --instrument:#0B1112; --raised:#101819;
    --rule:#263535; --rule-strong:#456063;
    --text:#EEF1EA; --text-2:#A5B4B1; --text-3:#81918E;
    --brand:#A6F8C4; --brand-soft:#3f8f63;
    --metro:#A6F8C4; --auto:#F9AC75;
    --display:'Poppins',system-ui,sans-serif; --mono:'Roboto Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--void);color:var(--text);font-family:var(--mono);overflow:hidden}
  #map{position:absolute;inset:0}
  .maplibregl-ctrl-attrib{font-family:var(--mono);font-size:9px!important;background:rgba(6,10,11,.6)!important}
  .maplibregl-ctrl-attrib a{color:var(--text-3)!important}
  canvas{outline:none}

  /* vignette + grain for cinematic frame */
  #frame{position:absolute;inset:0;pointer-events:none;z-index:5;
    box-shadow:inset 0 0 220px 40px rgba(6,10,11,.9);
    background:radial-gradient(130% 120% at 50% 42%, transparent 55%, rgba(6,10,11,.55) 100%)}

  /* ---- top title ---- */
  .hud{position:absolute;z-index:10;pointer-events:none}
  .title{left:34px;top:28px}
  .eyebrow{font-size:11px;letter-spacing:.26em;color:var(--text-3);text-transform:uppercase}
  .title h1{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:-.02em;margin:10px 0 0;line-height:1.05}
  .title h1 small{display:block;font-family:var(--mono);font-weight:400;font-size:12px;letter-spacing:.14em;color:var(--text-2);margin-top:8px}

  /* ---- clock ---- */
  .clock{right:34px;top:26px;text-align:right}
  .clock .time{font-family:var(--display);font-weight:700;font-size:40px;letter-spacing:.01em;line-height:1}
  .clock .meta{font-size:11px;letter-spacing:.14em;color:var(--text-3);margin-top:6px}

  /* ---- left stack: verdict above board ---- */
  .stack{left:34px;bottom:104px;width:380px;display:flex;flex-direction:column;gap:12px}
  .panel{background:rgba(11,17,18,.9);border:1px solid var(--rule);backdrop-filter:blur(6px);padding:14px 16px}
  .board .hd{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-3)}
  .board .hd b{color:var(--metro);font-weight:500}
  .rows{margin-top:8px;min-height:22px}
  .r{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid var(--rule);font-size:11.5px;color:var(--text-2)}
  .r:first-child{border-top:0}
  .r .rk{color:var(--text-3)} .r .tm{font-family:var(--display);font-weight:600;font-size:15px;color:var(--text)}
  .r.win .rk,.r.win .tm{color:var(--metro)} .r.win{color:var(--text)}
  .dotc{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:baseline}
  .r .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .more{font-size:10.5px;letter-spacing:.1em;color:var(--text-3);padding-top:6px;border-top:1px solid var(--rule)}
  .drive{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:baseline;margin-top:6px;padding-top:9px;border-top:1px solid var(--auto);font-size:11.5px;color:var(--text-2)}
  .drive .tm{font-family:var(--display);font-weight:600;font-size:15px;color:var(--auto)} .drive .rk{color:var(--auto)}
  .verdict{opacity:0;transform:translateY(8px);transition:.6s;pointer-events:none;display:none}
  .verdict.show{opacity:1;transform:none;display:block}
  .verdict .k{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-3)}
  .verdict .headline{font-family:var(--display);font-weight:700;font-size:28px;margin:6px 0 4px;line-height:1.1;color:var(--metro)}
  .verdict .grp{font-size:12px;color:var(--text);line-height:1.6;margin-top:6px}
  .verdict .grp i{font-style:normal;color:var(--metro)}
  .verdict .vs{margin-top:12px;padding-top:10px;border-top:1px solid var(--rule);font-size:12px;color:var(--text-2);line-height:1.6}
  .verdict .vs b.w{color:var(--metro);font-weight:500} .verdict .vs b.l{color:var(--auto);font-weight:500}
  .verdict .spread{margin-top:6px;font-size:10.5px;letter-spacing:.08em;color:var(--text-3)}

  /* ---- legend ---- */
  .legend{right:34px;bottom:124px;text-align:right;font-size:11px;letter-spacing:.1em;color:var(--text-2);line-height:2}
  .legend span{color:var(--text-2)} .legend .sw{display:inline-block;width:22px;height:0;border-top:3px solid var(--c);vertical-align:middle;margin-left:10px} .legend span i.sw::before{content:none}
  .legend .d{display:inline-block;width:22px;border-top:3px dashed var(--c);vertical-align:middle;margin-left:10px}
  .legend .net{border-top-color:var(--rule-strong)}
  .legend span.auto{--c:var(--auto)} .legend span.metro{--c:var(--metro)} .legend span.net{--c:var(--rule-strong)}

  /* ---- controls ---- */
  .bar{position:absolute;left:0;right:0;bottom:0;z-index:12;
    display:flex;align-items:center;gap:22px;flex-wrap:wrap;
    padding:16px 34px;background:linear-gradient(to top,rgba(6,10,11,.96),rgba(6,10,11,.7) 70%,transparent)}
  .seg{display:inline-flex;border:1px solid var(--rule);background:var(--instrument)}
  .seg button{background:none;border:0;color:var(--text-2);font-family:var(--mono);font-size:11px;letter-spacing:.14em;
    padding:10px 16px;cursor:pointer;text-transform:uppercase}
  .seg button.on{background:var(--brand);color:var(--void);font-weight:500}
  .ctl{display:flex;flex-direction:column;gap:6px}
  .ctl label{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-3)}
  .ctl .val{color:var(--text);font-weight:500}
  input[type=range]{accent-color:var(--brand);width:200px}
  .play{background:var(--brand);color:var(--void);border:0;font-family:var(--mono);font-weight:500;
    font-size:12px;letter-spacing:.14em;padding:12px 24px;cursor:pointer;text-transform:uppercase}
  .play:hover{background:#c5fcd9}
  .ghost{background:transparent;color:var(--text-2);border:1px solid var(--rule);font-family:var(--mono);
    font-size:11px;letter-spacing:.14em;padding:11px 16px;cursor:pointer;text-transform:uppercase}
  .ghost:hover{border-color:var(--rule-strong);color:var(--text)}
  .spacer{margin-left:auto}
  body.clean .bar{display:none} body.clean .stack{bottom:46px} body.clean .legend{bottom:50px} body.clean{cursor:none}
  .srclabel{font-size:10px;letter-spacing:.12em;color:var(--text-3)}

  /* ---- station markers ---- */
  .mk{font-family:var(--mono);font-size:11px;letter-spacing:.06em;white-space:nowrap;transform:translate(-50%,-50%);pointer-events:none}
  .mk .pin{width:9px;height:9px;border-radius:50%;margin:0 auto;border:0}
  .mk .tx{margin-top:5px;padding:3px 7px;background:rgba(6,10,11,.7);border:0;color:var(--text-2)}
  .mk.endpoint .tx{color:var(--text)}
  .mk.endpoint .pin{width:12px;height:12px}

  @media(max-width:820px){
    .title h1{font-size:22px} .clock .time{font-size:30px}
    .stack{left:16px;bottom:140px;width:min(380px,86vw)}
    .title{left:16px;top:16px} .clock{right:16px;top:16px}
    .legend{display:none}
    .bar{padding:12px 16px;gap:14px} input[type=range]{width:130px}
  }
.chip{margin-left:10px;background:transparent;color:var(--text-2);border:1px solid var(--rule-strong);border-radius:999px;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;padding:3px 10px;cursor:pointer} .chip:hover{color:var(--text)} .chip.on{background:var(--brand);color:var(--void);border-color:var(--brand);font-weight:500} input[type=range]:disabled{opacity:.3}.stack{left:34px;right:auto;bottom:auto;top:28px} body.clean .stack{bottom:auto;top:28px} .legend{left:34px;right:auto;text-align:left} .legend .sw,.legend .d{margin-left:0;margin-right:0;margin-left:10px}.bar{align-items:flex-end;gap:26px} .ctl{justify-content:flex-end} .seg button{height:38px;padding:0 16px;display:inline-flex;align-items:center} input[type=range]{height:40px;margin:0;display:block} .play,.ghost{height:40px;padding:0 24px;display:inline-flex;align-items:center} .ghost{padding:0 18px}@media(max-width:820px){
  html,body{height:100%;overflow:hidden}
  .clock{right:12px;top:10px} .clock .time{font-size:24px}
  .stack{left:12px;right:12px;top:10px;width:auto;max-width:calc(100vw - 110px);gap:8px}
  body.clean .stack{top:10px}
  .panel{padding:8px 10px}
  .board .hd{font-size:9px;letter-spacing:.12em}
  .r{font-size:10.5px;padding:4px 0;grid-template-columns:22px 1fr auto} .r .tm{font-size:13px}
  .verdict .headline{font-size:20px;margin:2px 0} .verdict .grp{font-size:10.5px;line-height:1.5;margin-top:2px}
  .verdict.show ~ .board{display:none}
  .bar{gap:8px 12px;padding:10px 12px;align-items:flex-end}
  .ctl{flex:1 1 auto;min-width:0} .ctl:nth-child(2){flex-basis:100%;order:3} .ctl:nth-child(3){order:2}
  .seg{max-width:100%;overflow-x:auto} .seg button{height:34px;padding:0 10px;font-size:10px;letter-spacing:.08em;white-space:nowrap}
  input[type=range]{width:100%;height:34px}
  .play,.ghost{height:36px;padding:0 16px;font-size:11px;order:4}
  .play{margin-left:auto} .spacer{display:none}
  .maplibregl-ctrl-attrib{margin-bottom:0}
}

/* readability bump */
.eyebrow,.clock .meta,.board .hd,.verdict .k,.more,.legend{font-size:12.5px}
.r{font-size:13.5px} .r .tm,.drive .tm{font-size:17px}
.verdict .grp,.verdict .vs{font-size:14px}
.ctl label{font-size:11.5px}
.seg button{font-size:12.5px}
.ghost,.chip{font-size:12.5px} .play{font-size:13.5px}
.mk{font-size:13px}
.maplibregl-ctrl-attrib{font-size:11px!important}
@media(max-width:820px){
  .r{font-size:12.5px} .r .tm{font-size:15px}
  .board .hd{font-size:11px}
  .verdict .grp{font-size:12.5px}
  .seg button{font-size:11.5px}
  .ctl label{font-size:10.5px}
  .mk{font-size:12px}
}
</style>
</head>
<body>
<div id="map"></div>
<div id="frame"></div>

<div class="hud title">
  
  
</div>
<div class="hud clock">
  <div class="time" id="clock">--:--</div>
  
</div>

<div class="hud stack">
  <div class="panel verdict" id="verdict"></div>
  <div class="panel board">
    <div class="hd"><span>Metro race</span><span><b id="arr">0</b> / <span id="nr">30</span> arrived</span></div>
    <div class="rows" id="rows"></div>
    <div class="more" id="more" style="display:none"></div>

  </div>
</div>

<div class="hud legend" id="legend"></div>

<div class="bar">
  <div class="ctl"><label>Commute</label><div class="seg" id="seg-dir">
    <button data-v="morning" class="on">Morning</button>
    <button data-v="evening">Evening</button>
  </div></div>
  <div class="ctl">
    <label>Day <span class="val" id="day-val"></span></label>
    <div class="seg" id="seg-day"><button data-v="avg" class="on">Mon–Fri</button><button data-v="0">Mon</button><button data-v="1">Tue</button><button data-v="2">Wed</button><button data-v="3">Thu</button><button data-v="4">Fri</button></div>
  </div>
  <div class="ctl">
    <label>Departure <span class="val" id="dep-val"></span></label>
    <input type="range" id="sl-dep" min="0" max="10" value="6">
  </div>
  
  <button class="play" id="btn-play">Race</button>
  <button class="ghost" id="btn-skip">Skip</button>
  <div class="spacer srclabel" id="daylabel"></div>
</div>

// ---------- geometry helpers ----------
const R = 111320;
function segLen(a,b){const dy=(b[1]-a[1])*R, dx=(b[0]-a[0])*R*Math.cos(a[1]*Math.PI/180);return Math.hypot(dx,dy);}
function poly(coords){
  const cum=[0]; for(let i=1;i<coords.length;i++) cum.push(cum[i-1]+segLen(coords[i-1],coords[i]));
  return {c:coords, cum, len:cum[cum.length-1]||1};
}
function at(p,f){
  f=Math.max(0,Math.min(1,f)); const d=f*p.len; let i=1;
  while(i<p.cum.length-1 && p.cum[i]<d) i++;
  const a=p.c[i-1], b=p.c[i]||a, span=(p.cum[i]-p.cum[i-1])||1, u=(d-p.cum[i-1])/span;
  return [a[0]+(b[0]-a[0])*u, a[1]+(b[1]-a[1])*u];
}
function slice(p,f){ // coords from start up to fraction f, with interpolated end
  f=Math.max(0,Math.min(1,f)); const d=f*p.len; const out=[p.c[0]];
  for(let i=1;i<p.c.length;i++){ if(p.cum[i]<=d){out.push(p.c[i]);} else {out.push(at(p,f));break;} }
  return out.length>1?out:[p.c[0],p.c[0]];
}

  rows.forEach(r=>r.j.forEach(j=>{const k=j[0]+"|"+j[1]; if(!m.has(k)) m.set(k,[]); m.get(k).push(j);}));
  const j=Array.from(m.values()).map(a=>{

    return [a[0][0],a[0][1],av(2),av(3),av(4),av(5),av(6),Math.round(av(7))];

  const ds=rows.map(r=>r.direct).filter(v=>v!=null);
  return _typCache[key]={t:rows[0].t,day:"Typical Mon–Fri",direct:ds.reduce((a,b)=>a+b,0)/ds.length,j:j};
}
function tSec(t){const[h,m]=t.split(":").map(Number);return h*3600+m*60;}

// quadratic arc between two [lon,lat] points
function arc(a,b,bend,n){
  n=n||40;
  const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2, dx=b[0]-a[0], dy=b[1]-a[1];
  const c=[mx-dy*bend, my+dx*bend], out=[];
  for(let i=0;i<=n;i++){const u=i/n,v=1-u;out.push([v*v*a[0]+2*v*u*c[0]+u*u*b[0], v*v*a[1]+2*v*u*c[1]+u*u*b[1]]);}
  return out;
}

let RC=[], WIN=[], BEST=0, ARRIVED=0;
function build(){
  if(!S.built) return;
  const dd=D[S.dir], pd=perDay();
  $("#sl-dep").max=pd-1;
  if(S.dep>pd-1) S.dep=Math.floor(pd/2);
  $("#sl-dep").value=S.dep;
  const row=rowNow();
  $("#dep-val").textContent=row.t;
  $("#day-val").textContent=row.day;
  $("#daylabel").textContent="";

  const O=[dd.origin.lon,dd.origin.lat], DS=[dd.dest.lon,dd.dest.lat];
  const fmP=dd.entries.map((e,i)=>({p:poly(arc(O,[e.lon,e.lat],i%2?0.22:-0.22)),arc:null}));
  const lmP=dd.exits.map((x,i)=>({p:poly(arc([x.lon,x.lat],DS,i%2?0.22:-0.22))}));
  const col=dd.entries.map((e,i)=>PAL[i%PAL.length]);

  RC=row.j.map(j=>{
    const ei=j[0],xi=j[1],fm=j[2],wait=j[3],ride=j[4],lm=j[5];
    const E=dd.entries[ei], X=dd.exits[xi];
    const pair=dd.pairs[E.id+"|"+X.id], pr=poly(pair.ride);
    const segs=[
      {dur:fm,poly:fmP[ei].p},
      {dur:180+wait,at:fmP[ei].p.c[fmP[ei].p.c.length-1]},
      {dur:ride,poly:pr},
      {dur:120,at:pr.c[pr.c.length-1]},
      {dur:lm,poly:lmP[xi].p},
    ];
    let t=0; segs.forEach(s=>{s.t0=t;t+=s.dur;s.t1=t;});
    return {segs,total:t,E,X,ei,xi,pair,color:col[ei],win:false};
  });
  RC.sort((a,b)=>a.total-b.total);
  BEST=RC[0].total;
  RC.forEach(r=>{r.win=(r.total-BEST)<60;});
  WIN=RC.filter(r=>r.win);
  S.total=RC[RC.length-1].total+10;
  S.t=0; S.done=false; ARRIVED=0;
  $("#nr").textContent=RC.length; $("#arr").textContent="0"; $("#rows").innerHTML=""; $("#more").style.display="none";
  $("#verdict").classList.remove("show");

  map.getSource("tracks").setData({type:"FeatureCollection",features:Object.values(dd.pairs).map(p=>lineF(p.ride))});
  const feeders=[];
  dd.entries.forEach((e,i)=>feeders.push(lineF(fmP[i].p.c,{c:col[i]})));
  dd.exits.forEach((x,i)=>feeders.push(lineF(lmP[i].p.c,{c:"#A5B4B1"})));
  map.getSource("feeders").setData({type:"FeatureCollection",features:feeders});
  map.getSource("winTracks").setData(emptyFC()); map.getSource("winFeeders").setData(emptyFC());
  const st=[];
  dd.entries.forEach((e,i)=>st.push(ptF([e.lon,e.lat],{c:col[i]})));
  dd.exits.forEach(x=>st.push(ptF([x.lon,x.lat],{c:"#A5B4B1"})));
  map.getSource("stations").setData({type:"FeatureCollection",features:st});
  map.setPaintProperty("tracks","line-opacity",0.16); map.setPaintProperty("feeders","line-opacity",0.28);
  S.fmP=fmP; S.lmP=lmP; S.col=col;

  $("#legend").innerHTML=dd.entries.map((e,i)=>'<div><span style="--c:'+col[i]+'">via '+e.name+'<i class="sw"></i></span></div>').join("")+
    '<div><span style="--c:#A5B4B1">dotted arc: auto / walk<i class="d"></i></span></div>';

  clearMarkers();
  addMarker(dd.origin.lon,dd.origin.lat,dd.origin.name.toUpperCase(),"endpoint","#EEF1EA");
  addMarker(dd.dest.lon,dd.dest.lat,dd.dest.name.toUpperCase(),"endpoint","#FFD24A");

  const b=new maplibregl.LngLatBounds();
  [].concat(fmP.map(f=>f.p.c),lmP.map(l=>l.p.c),Object.values(dd.pairs).map(p=>p.ride)).forEach(cs=>cs.forEach(c=>b.extend(c)));
  map.fitBounds(b,{padding:(innerWidth<=820?{top:230,bottom:190,left:28,right:28}:{top:110,bottom:200,left:440,right:170}),duration:Q.has('t')?0:900});
  frameWork(0);
}

function posOf(r,t){
  if(t>=r.total){const s=r.segs[r.segs.length-1];return s.poly?at(s.poly,1):s.at;}
  const s=r.segs.find(s=>t<s.t1)||r.segs[0];
  const f=s.dur?(t-s.t0)/s.dur:1;
  return s.poly?at(s.poly,f):s.at;
}

function frameWork(now){
  if(!S.built||!RC.length) return;
  const feats=[], lit=[], litF=[];
  RC.forEach(r=>{
    const done=S.t>=r.total, p=posOf(r,S.t);
    let rad=3.4,g=7,o=1,go=0.16;
    if(done){
      if(r.win){const pu=0.5+0.5*Math.sin(now/300);rad=5;g=11+3*pu;go=0.28;}
      else {rad=2.2;g=0;o=0.35;go=0;}
    }
    feats.push(ptF(p,{c:r.color,r:rad,g:g,o:o,go:go}));
    // traveled path lights up behind the agent
    if(S.t>0){
      const op=done?(r.win?0.9:0.14):0.55;
      r.segs.forEach((s,si)=>{
        if(!s.poly||S.t<=s.t0) return;
        const cs=S.t>=s.t1?s.poly.c:slice(s.poly,(S.t-s.t0)/s.dur);
        if(cs.length>1) (si===2?lit:litF).push(lineF(cs,{c:r.color,o:op}));
      });
    }
  });
  map.getSource("dots").setData({type:"FeatureCollection",features:feats});
  map.getSource("lit").setData({type:"FeatureCollection",features:lit});
  map.getSource("litFeed").setData({type:"FeatureCollection",features:litF});
  update();
}

function nm(r){return r.E.name+" → "+r.X.name;}
function update(){
  const row=rowNow(), t0=tSec(row.t);
  $("#clock").textContent=fmtClock(t0+S.t);
  const rows=$("#rows");
  while(ARRIVED<RC.length && S.t>=RC[ARRIVED].total){
    const r=RC[ARRIVED]; ARRIVED++;
    if(ARRIVED<=5){
      const tie=WIN.length>1&&r.win;
      const rk=r.win?(tie?"T1":"1"):String(ARRIVED);
      const d=document.createElement("div"); d.className="r"+(r.win?" win":"");
      d.innerHTML='<span class="rk">'+rk+'</span><span class="nm" title="'+nm(r)+'"><i class="dotc" style="background:'+r.color+'"></i>'+nm(r)+'</span><span class="tm">'+mn(r.total)+' min</span>';
      rows.appendChild(d);
    }
    $("#arr").textContent=ARRIVED;
    if(ARRIVED>5){const m=$("#more");m.style.display="block";m.textContent="+ "+(ARRIVED-5)+" more routes arrived";}
  }
  if(!S.done && S.t>=BEST+4 && ARRIVED>=WIN.length) showVerdict();
}

function showVerdict(){
  S.done=true;
  const dd=D[S.dir], n=WIN.length, slow=RC[RC.length-1];
  const groups={}, gcol={};
  WIN.forEach(r=>{(groups[r.X.name]=groups[r.X.name]||[]).push('<i style="color:'+r.color+'">'+r.E.name+'</i>');});
  const lines=Object.keys(groups).map(x=>groups[x].join(" · ")+' → '+x).join("<br>");
  $("#verdict").innerHTML=
    '<div class="headline">'+mn(BEST)+' min</div>'+
    '<div class="grp">'+lines+'</div>'+
    '';
  $("#verdict").classList.add("show");
  map.setPaintProperty("tracks","line-opacity",0.06); map.setPaintProperty("feeders","line-opacity",0.08);
  const seen=new Set();
  WIN.forEach(r=>{[[r.E,r.color],[r.X,"#A5B4B1"]].forEach(a=>{ if(!seen.has(a[0].id)){seen.add(a[0].id);addMarker(a[0].lon,a[0].lat,a[0].name,"",a[1]);} });});
}

// ---------- loop ----------
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(S.playing){
    S.t+=dt*S.speed;
    if(S.t>=S.total){S.t=S.total;S.playing=false;$("#btn-play").textContent="Replay";}
  }
  frameWork(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function play(){ if(S.t>=S.total){S.t=0;build();} S.playing=true; $("#btn-play").textContent="Restart"; }

// ---------- controls ----------
function restart(){S.playing=false;S.t=0;build();}
document.querySelectorAll("#seg-dir button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("#seg-dir button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); S.dir=b.dataset.v; S.dep=Math.floor(perDay()/2); restart(); if(!Q.has("t")) setTimeout(play,500);
}));
document.querySelectorAll("#seg-day button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("#seg-day button").forEach(x=>x.classList.remove("on")); b.classList.add("on");
  if(b.dataset.v==="avg"){S.typ=true;}else{S.typ=false;S.day=+b.dataset.v;}
  $("#btn-play").textContent="Race"; restart(); if(!Q.has("t")) setTimeout(play,400);
}));
$("#sl-dep").addEventListener("input",e=>{S.dep=+e.target.value;$("#btn-play").textContent="Race";restart();});
$("#btn-play").addEventListener("click",()=>{restart();play();});
$("#btn-skip").addEventListener("click",()=>{S.t=S.total;S.playing=false;$("#btn-play").textContent="Replay";});
window.addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault(); S.playing?S.playing=false:play();}});
</script>
